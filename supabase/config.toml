project_id = "svfcfhhjvweaexspekwe"

# Applied to hosted projects with `supabase config push`, which only changes the properties
# declared here. Keep this file to settings that are the same in every environment; per-environment
# values (site_url, redirect URLs) are set by the deploy workflow.

[auth]
# No public sign-up: accounts are created by an admin (see scripts/provision-user.ts).
enable_signup = false
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = true

[functions.import-buildings]
# Reject requests without a valid user JWT at the gateway too, before the function runs.
verify_jwt = true
