# Deploys one environment: database migrations, the Edge Functions, then the static frontend to
# Firebase Hosting, followed by a smoke test of the live site. The full CI suite runs first on the
# same commit, and nothing changes unless the access token and the auth settings check out.
#
#   release published  -> production (the "production" environment requires an approval)
#   manual run         -> the environment you pick
#
# Each GitHub environment holds its own configuration:
#   variables: SUPABASE_PROJECT_REF, SUPABASE_DB_POOLER_HOST, VITE_SUPABASE_URL,
#              VITE_SUPABASE_PUBLISHABLE_KEY, VITE_SUPABASE_PROJECT_ID, FIREBASE_PROJECT_ID,
#              SITE_URL, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
#   secrets:   SUPABASE_ACCESS_TOKEN (scoped to one project: Project Settings read, Auth Config
#              read, Edge Functions read-write; nothing else),
#              SUPABASE_DB_PASSWORD (migrations connect to Postgres directly, not via the API)
name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: environment
        required: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'release' && 'production' || inputs.environment }}
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-${{ github.event_name == 'release' && 'production' || inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token for Google Cloud Workload Identity Federation (no stored keys)
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_POOLER_HOST: ${{ vars.SUPABASE_DB_POOLER_HOST }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.x

      - name: Check the environment is configured
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF \
            SUPABASE_DB_POOLER_HOST VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY \
            VITE_SUPABASE_PROJECT_ID SITE_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::Missing environment configuration:$missing"; exit 1; }

      # Read-only calls to every Management API endpoint this job uses, so a token missing a
      # permission fails here, before anything changes, with the full list of what is missing.
      - name: Preflight - access token permissions
        run: |
          api="https://api.supabase.com"
          failed=0
          for endpoint in "v1/projects/$SUPABASE_PROJECT_REF" \
            "v1/projects/$SUPABASE_PROJECT_REF/config/auth" "v1/projects/$SUPABASE_PROJECT_REF/functions"; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api/$endpoint")
            echo "$status GET /$endpoint"
            [ "$status" = "200" ] || failed=1
          done
          [ "$failed" = "0" ] || { echo "::error::The Supabase access token cannot read every endpoint the deploy needs (see above)."; exit 1; }
      # The [auth] settings in supabase/config.toml, plus this environment's site URL, are verified
      # here but never changed: Supabase only lets a token that could also delete the project change
      # them, so an administrator applies them (docs/RUNBOOK.md, "Change auth settings").
      - name: Verify auth settings
        run: >-
          deno run --frozen --config scripts/deno.json --allow-read=supabase --allow-env
          --allow-net=api.supabase.com scripts/apply-auth-config.ts --check

      # Backend first: the new frontend may depend on new tables or functions, never the reverse.
      # Migrations go straight to Postgres through the IPv4 session pooler (runners have no IPv6),
      # so the API token needs no database permissions at all.
      - name: Apply database migrations
        run: |
          password=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p | @uri')
          echo "::add-mask::$password" # the encoded form differs from the masked secret
          db_url="postgresql://postgres.$SUPABASE_PROJECT_REF:$password@$SUPABASE_DB_POOLER_HOST:5432/postgres"
          supabase db push --db-url "$db_url" --dry-run
          supabase db push --db-url "$db_url" --yes
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Build the frontend for this environment
        run: |
          bun install --frozen-lockfile
          bun run build
      # The committed .env points at Lovable's backend; the variables above must win.
      - name: Verify the bundle targets this environment
        run: |
          grep -rqF "$VITE_SUPABASE_URL" .output/public/assets \
            || { echo "::error::The bundle does not reference $VITE_SUPABASE_URL"; exit 1; }
          lovable_ref=$(grep -E '^VITE_SUPABASE_PROJECT_ID=' .env | cut -d'"' -f2)
          if [ "$lovable_ref" != "$VITE_SUPABASE_PROJECT_ID" ] && grep -rqF "$lovable_ref" .output/public/assets; then
            echo "::error::The bundle still references the Lovable backend ($lovable_ref)"; exit 1
          fi

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          DEPLOY_MESSAGE: ${{ github.ref_name }} ${{ github.sha }}
        run: >-
          npx -y firebase-tools@15.34.1 deploy --only hosting --non-interactive
          --project "$FIREBASE_PROJECT_ID" --message "$DEPLOY_MESSAGE"

      - name: Smoke test the live environment
        run: |
          fail() { echo "::error::$1"; exit 1; }
          curl -fsS "$SITE_URL/" | grep -q "<title>Buildings Registry</title>" || fail "Home page did not load"
          curl -fsS "$SITE_URL/buildings" | grep -q "_TSR" || fail "SPA route /buildings did not load"
          curl -fsSI "$SITE_URL/buildings-template.xlsx" > /dev/null || fail "Excel template missing"
          curl -fsSI "$SITE_URL/" | grep -qi "^x-frame-options: DENY" || fail "Security headers missing"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$VITE_SUPABASE_URL/functions/v1/import-buildings" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY")
          [ "$status" = "401" ] || fail "import-buildings should reject anonymous calls with 401, got $status"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$VITE_SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" \
            -d '{"email": "smoke-test@example.com", "password": "a-long-enough-password-1"}')
          [ "$status" = "422" ] || fail "Public sign-up should be disabled (422), got $status"
          echo "Smoke test passed for $SITE_URL"
