# The [auth] settings below are applied to the deployed projects by scripts/apply-auth-config.ts
# (which fails on any setting it cannot map), and verify_jwt by `supabase functions deploy`. Keep
# this file to settings that are the same in every environment; per-environment values (site_url,
# redirect URLs) come from the deploy workflow.

[auth]
# No public sign-up: accounts are created by an admin (see scripts/provision-user.ts).
enable_signup = false
minimum_password_length = 12

[auth.email]
# Do not set enable_signup here: the CLI maps it to the whole email provider, so `false` would
# disable email *login* too. [auth] enable_signup above already blocks new sign-ups.
enable_confirmations = true

[functions.import-buildings]
# Reject requests without a valid user JWT at the gateway too, before the function runs.
verify_jwt = true
