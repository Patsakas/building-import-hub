# Deploys one environment: database migrations and auth settings, the Edge Functions, then the
# static frontend to Firebase Hosting, followed by a smoke test of the live site. The full CI
# suite runs first on the same commit.
#
#   release published  -> production (the "production" environment requires an approval)
#   manual run         -> the environment you pick
#
# Each GitHub environment holds its own configuration:
#   variables: SUPABASE_PROJECT_REF, VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY,
#              VITE_SUPABASE_PROJECT_ID, FIREBASE_PROJECT_ID, SITE_URL,
#              GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
#   secrets:   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: environment
        required: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'release' && 'production' || inputs.environment }}
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-${{ github.event_name == 'release' && 'production' || inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token for Google Cloud Workload Identity Federation (no stored keys)
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Check the environment is configured
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF \
            VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID SITE_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::Missing environment configuration:$missing"; exit 1; }

      # Backend first: the new frontend may depend on new tables or functions, never the reverse.
      - name: Link the Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply database migrations
        run: |
          supabase db push --linked --dry-run
          supabase db push --linked --yes
      - name: Apply auth and function settings from config.toml
        run: |
          supabase config diff --project-ref "$SUPABASE_PROJECT_REF"
          supabase config push --project-ref "$SUPABASE_PROJECT_REF" --yes
      - name: Set this environment's auth site URL
        run: |
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"site_url\": \"$SITE_URL\", \"uri_allow_list\": \"$SITE_URL/**\"}" > /dev/null
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Build the frontend for this environment
        run: |
          bun install --frozen-lockfile
          bun run build
      # The committed .env points at Lovable's backend; the variables above must win.
      - name: Verify the bundle targets this environment
        run: |
          grep -rqF "$VITE_SUPABASE_URL" .output/public/assets \
            || { echo "::error::The bundle does not reference $VITE_SUPABASE_URL"; exit 1; }
          lovable_ref=$(grep -E '^VITE_SUPABASE_PROJECT_ID=' .env | cut -d'"' -f2)
          if [ "$lovable_ref" != "$VITE_SUPABASE_PROJECT_ID" ] && grep -rqF "$lovable_ref" .output/public/assets; then
            echo "::error::The bundle still references the Lovable backend ($lovable_ref)"; exit 1
          fi

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          DEPLOY_MESSAGE: ${{ github.ref_name }} ${{ github.sha }}
        run: >-
          npx -y firebase-tools@15.34.1 deploy --only hosting --non-interactive
          --project "$FIREBASE_PROJECT_ID" --message "$DEPLOY_MESSAGE"

      - name: Smoke test the live environment
        run: |
          fail() { echo "::error::$1"; exit 1; }
          curl -fsS "$SITE_URL/" | grep -q "<title>Buildings Registry</title>" || fail "Home page did not load"
          curl -fsS "$SITE_URL/buildings" | grep -q "_TSR" || fail "SPA route /buildings did not load"
          curl -fsSI "$SITE_URL/buildings-template.xlsx" > /dev/null || fail "Excel template missing"
          curl -fsSI "$SITE_URL/" | grep -qi "^x-frame-options: DENY" || fail "Security headers missing"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$VITE_SUPABASE_URL/functions/v1/import-buildings" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY")
          [ "$status" = "401" ] || fail "import-buildings should reject anonymous calls with 401, got $status"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$VITE_SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" \
            -d '{"email": "smoke-test@example.com", "password": "a-long-enough-password-1"}')
          [ "$status" = "422" ] || fail "Public sign-up should be disabled (422), got $status"
          echo "Smoke test passed for $SITE_URL"
