# Runs on every pull request and on every push to main and to the Lovable-synced branch,
# so changes generated in Lovable get the same checks as hand-written ones. The Deploy workflow
# also calls it, so nothing is deployed without passing the full suite on the same commit.
name: CI

on:
  pull_request:
  push:
    branches: [main, lovable]
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when called from Deploy, so a deploy's CI run never
# cancels (or is cancelled by) the regular CI run for the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.x

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: The committed .env holds only public settings
        run: deno run --allow-read --allow-run=git scripts/check-env-file.ts
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Verify the build is a static site
        run: |
          test -f .output/public/_shell.html \
            || { echo "::error::No prerendered SPA shell in .output/public (is spa mode enabled?)"; exit 1; }
      # TanStack Start lists every createServerFn in a manifest next to getServerFnById. Static
      # hosting has no server to run them, so the manifest must be empty.
      - name: Verify the build has no server functions
        run: |
          files=$(grep -rlE 'function getServerFnById' .output/server || true)
          if [ -z "$files" ]; then
            echo "::error::Server function manifest not found; update this check for the new TanStack Start output."
            exit 1
          fi
          if ! grep -qE '^var manifest = \{\};$' $files; then
            echo "::error::The build contains TanStack server functions (createServerFn), which cannot run on static hosting. Move them to a Supabase Edge Function."
            grep -A3 '^var manifest' $files
            exit 1
          fi
      - name: Verify the build contains no server-side secrets
        run: deno run --allow-read scripts/check-bundle-secrets.ts .output/public

  edge-functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Remote module hosts the functions may import from; anything else must be added on purpose.
      ALLOWED_IMPORTS: cdn.sheetjs.com,jsr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.x

      # Every function has its own deno.json and committed deno.lock (--frozen fails on drift).
      - name: Lint, typecheck and test each function
        run: |
          for config in supabase/functions/*/deno.json; do
            dir=$(dirname "$config")
            echo "::group::$dir"
            deno lint --config "$config" "$dir"
            deno check --frozen --config "$config" --allow-import="$ALLOWED_IMPORTS" "$dir/index.ts"
            deno test --frozen --config "$config" --allow-import="$ALLOWED_IMPORTS" \
              --allow-read=public --permit-no-files "$dir"
            echo "::endgroup::"
          done
      - name: Lint and typecheck integration tests
        run: |
          config=supabase/tests/functions/deno.json
          deno lint --config "$config" supabase/tests/functions
          deno check --frozen --config "$config" --allow-import="$ALLOWED_IMPORTS" supabase/tests/functions
      - name: Lint and typecheck scripts
        run: |
          config=supabase/functions/import-buildings/deno.json
          deno lint --config "$config" scripts
          deno check --frozen --config "$config" --allow-import="$ALLOWED_IMPORTS" scripts/*.ts

  database:
    name: Database and integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Migrations are identical in drizzle/ (Lovable) and supabase/ (deployments)
        run: deno run --allow-read scripts/check-migration-mirror.ts
      # Applies every migration in supabase/migrations to an empty database, then seed.sql.
      - name: Start a local Supabase stack
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor
      - name: Row Level Security tests (pgTAP)
        run: supabase test db
      - name: Edge Function integration tests
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=')"
          SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
            deno test --frozen --config supabase/tests/functions/deno.json \
              --allow-net --allow-env --allow-import=cdn.sheetjs.com,jsr.io supabase/tests/functions

      # End-to-end: the static build against the local stack, served by the Firebase Hosting
      # emulator with the production rewrites, driven by Playwright.
      - name: Build the frontend against the local stack
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=')"
          bun install --frozen-lockfile
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" bun run build
      - name: Serve it with the Firebase Hosting emulator
        run: |
          npx -y firebase-tools@15.34.1 emulators:start --only hosting --project demo-e2e > hosting.log 2>&1 &
          for _ in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:5000/ && exit 0; sleep 2; done
          cat hosting.log; exit 1
      - name: End-to-end tests (Playwright)
        run: |
          bunx playwright install --with-deps chromium
          bun run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - name: Edge runtime logs
        if: failure()
        run: docker logs "$(docker ps -q --filter name=supabase_edge_runtime)" 2>&1 | tail -100
